[workspace]
members = ["crates/predator-core", "crates/predator-sense", "crates/predator-sense-gui"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-2.0-or-later"
authors = ["PredatorSense Linux contributors"]
repository = "https://github.com/AxDSan/predator-sense-linux"
homepage = "https://github.com/AxDSan/predator-sense-linux"
rust-version = "1.85"
description = "Unofficial Linux control panel for Acer Predator lighting, fans, MagForce and overclocking"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
clap = { version = "4", features = ["derive"] }
libc = "0.2"
dirs = "6"
chrono = { version = "0.4", features = ["serde"] }
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui = "0.37"

[profile.release]
strip = true
